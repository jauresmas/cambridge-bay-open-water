# Contrôle à chaque envoi : le code se compile et les méthodes passent leurs tests
# (cas construits, sans réseau ni téléchargement).
name: Contrôle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests des méthodes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Compilation
        run: python -m compileall -q cbow scripts tests
      - name: Tests
        run: python -m pytest -v
